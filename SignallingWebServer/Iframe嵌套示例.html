<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <title>Iframe嵌套页面通信示例</title>
    <script>
        let iframeWindow = null;

        function initIframe() {
            const iframe = document.getElementById("embeddedPage");
            iframeWindow = iframe.contentWindow;
            console.log("Iframe ready:", iframeWindow);
        }

        function sendMessageToIframe(msg) {
            if (iframeWindow) {
                msg.type = 'IFRAME';
                iframeWindow.postMessage(msg, "http://127.0.0.1:80");
                console.log("已发送:", msg);
            } else {
                console.warn("iframe 未加载完成！");
            }
        }

        // 接收来自子页面的返回消息
        window.addEventListener("message", (event) => {
            if (event.data.type !== 'IFRAME')
                return;

            console.log("收到流送页面消息：", event.data);

            document.getElementById("received").textContent =
                "收到流送页面回复：" + JSON.stringify(event.data);
        });
    </script>
</head>

<body>
    <h1>Iframe页面</h1>
    <button onclick="sendMessageToIframe({data: 'night'})">黑夜</button>
    <button onclick="sendMessageToIframe({data: 'sunny'})">白天</button>
    <button onclick="sendMessageToIframe({data: 'cloudy'})">晴天</button>
    <button onclick="sendMessageToIframe({data: 'rain'})">雨天</button>
    <button onclick="sendMessageToIframe({data: 'snow'})">雪天</button>
    <button onclick="sendMessageToIframe({data: 'OpenOutside'})">进入园区</button>
    <button onclick="sendMessageToIframe({data: 'OpenInside'})">进入室内</button>
    <button onclick="sendMessageToIframe({data: 'PlayAnim_Inside'})">室内漫游</button>
    <button onclick="sendMessageToIframe({data: 'PlayAnim_Outside_In'})">室外内圈漫游</button>
    <button onclick="sendMessageToIframe({data: 'PlayAnim_Outside_Out'})">室外外圈漫游</button>
    <button onclick="sendMessageToIframe({data: 'PlayAnim_Outside_Combine'})">合并漫游</button>
    <button onclick="sendMessageToIframe({data: 'StopAnim'})">停止漫游</button>
    <button onclick="sendMessageToIframe({data: 'PauseAnim'})">暂停漫游</button>

    <p id="received" style="margin-top: 10px; color: blue;">
        等待回复...
    </p>

    <iframe id="embeddedPage" src="http://127.0.0.1:80/" width="1280" height="360" onload="initIframe()"
        style="border: 1px solid #ccc;"></iframe>
</body>

</html>
